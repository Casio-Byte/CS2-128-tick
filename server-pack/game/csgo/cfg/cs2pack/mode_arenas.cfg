// Multi-1v1 arenas on am_ maps. CS2 Match pairs players, teleports them into
// arenas and ends the round when every arena is done (or after 2 minutes).
exec cs2pack/mode_reset.cfg
mp_ignore_round_win_conditions 1
mp_freezetime 2
mp_roundtime 2.5
mp_round_restart_delay 3
mp_buytime 0
mp_buy_allow_guns 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_autoteambalance 0
mp_limitteams 0
mp_halftime 0
mp_maxrounds 0
mp_timelimit 30
mp_join_grace_time 0
mp_warmup_end
